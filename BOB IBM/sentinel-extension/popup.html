<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sentinel</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 360px; min-height: 480px;
    font-family: -apple-system,"Segoe UI",system-ui,sans-serif;
    font-size: 13px; color: #1f2328; background: #f7f8fa;
  }

  /* Header */
  .header {
    background: #1f2328; color: #fff;
    padding: 14px 16px; display: flex; align-items: center; gap: 10px;
  }
  .header svg { width: 22px; height: 22px; fill: #3b82d4; flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
  .header p  { font-size: 11px; color: #a0aab4; }
  .status-pill {
    margin-left: auto; display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }
  .status-dot.off { background: #6b7280; }

  /* Toggle row */
  .toggle-row {
    background: #fff; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #e5e7eb;
  }
  .toggle-label { font-size: 13px; font-weight: 600; color: #1f2328; }
  .toggle-sub   { font-size: 11.5px; color: #57606a; margin-top: 1px; }
  .toggle {
    position: relative; width: 40px; height: 22px;
    background: #d1d5db; border-radius: 11px;
    cursor: pointer; transition: background .2s; flex-shrink: 0;
  }
  .toggle.on { background: #3b82d4; }
  .toggle-knob {
    position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: left .2s;
    pointer-events: none;
  }
  .toggle.on .toggle-knob { left: 21px; }

  /* Tabs */
  .tabs { display: flex; background: #fff; border-bottom: 2px solid #e5e7eb; }
  .tab {
    flex: 1; padding: 9px 4px; text-align: center; font-size: 12px;
    font-weight: 600; color: #57606a; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    transition: color .15s, border-color .15s;
  }
  .tab.active { color: #3b82d4; border-bottom-color: #3b82d4; }
  .tab-panel { display: none; padding: 12px 14px; }
  .tab-panel.active { display: block; }

  /* Summary cards */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .summary-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; text-align: center; }
  .summary-card .num { font-size: 22px; font-weight: 800; }
  .summary-card .lbl { font-size: 11px; color: #57606a; margin-top: 1px; }
  .num-block  { color: #ef4444; }
  .num-redact { color: #f97316; }
  .num-warn   { color: #f59e0b; }
  .num-allow  { color: #22c55e; }

  /* Log */
  .log-entry {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 7px;
    padding: 9px 11px; margin-bottom: 7px;
  }
  .log-top { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 1px 7px; border-radius: 20px;
  }
  .badge-block  { background: #fef2f2; color: #ef4444; }
  .badge-redact { background: #fff7ed; color: #f97316; }
  .badge-warn   { background: #fefce8; color: #ca8a04; }
  .badge-allow  { background: #f0fdf4; color: #22c55e; }
  .badge-allow_override { background: #fef9c3; color: #854d0e; }
  .log-site  { font-size: 11px; color: #57606a; }
  .log-findings { font-size: 11.5px; color: #3b4048; margin-top: 2px; }
  .log-ts    { font-size: 10.5px; color: #9ca3af; margin-left: auto; white-space: nowrap; }
  .empty-log { text-align: center; color: #57606a; padding: 28px 0; font-size: 12.5px; }

  /* Rules */
  .rule-item {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 7px;
    padding: 9px 12px; margin-bottom: 7px;
    display: flex; align-items: center; gap: 8px;
  }
  .rule-name { font-size: 12.5px; font-weight: 600; flex: 1; }
  .rule-level { font-size: 10.5px; color: #57606a; }
  .rule-toggle { position: relative; width: 32px; height: 18px; background: #d1d5db; border-radius: 9px; cursor: pointer; flex-shrink: 0; transition: background .2s; }
  .rule-toggle.on { background: #3b82d4; }
  .rule-toggle-knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .2s; pointer-events: none; }
  .rule-toggle.on .rule-toggle-knob { left: 16px; }

  .add-rule-form { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-top: 10px; }
  .add-rule-form label { display: block; font-size: 11.5px; font-weight: 600; color: #57606a; margin-bottom: 3px; }
  .add-rule-form input, .add-rule-form select {
    width: 100%; padding: 6px 9px; font-size: 12.5px;
    border: 1px solid #e5e7eb; border-radius: 6px;
    background: #f7f8fa; color: #1f2328; margin-bottom: 8px;
    font-family: inherit; outline: none;
  }
  .add-rule-form input:focus, .add-rule-form select:focus { border-color: #3b82d4; background: #fff; }
  .btn-add { width: 100%; padding: 7px; background: #3b82d4; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-add:hover { opacity: .88; }
  .msg { font-size: 12px; margin-top: 6px; }

  .clear-btn {
    width: 100%; padding: 7px; background: #f7f8fa; color: #57606a;
    border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px;
    font-weight: 600; cursor: pointer; margin-top: 10px; font-family: inherit;
  }
  .clear-btn:hover { border-color: #ef4444; color: #ef4444; }
</style>
</head>
<body>

<div class="header">
  <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2zm0 4.5l5 2.25V12c0 3.5-2.3 6.75-5 7.85C9.3 18.75 7 15.5 7 12V8.75L12 6.5z"/></svg>
  <div>
    <h1>Sentinel</h1>
    <p>LLM Data Guard</p>
  </div>
  <div class="status-pill">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-label">Active</span>
  </div>
</div>

<div class="toggle-row">
  <div>
    <div class="toggle-label">Guard Enabled</div>
    <div class="toggle-sub">Intercept sensitive LLM inputs</div>
  </div>
  <div class="toggle on" id="main-toggle">
    <div class="toggle-knob"></div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="tab-summary">📊 Summary</div>
  <div class="tab"        data-tab="tab-log">📋 Log</div>
  <div class="tab"        data-tab="tab-rules">⚙️ Rules</div>
</div>

<!-- Tab: Summary -->
<div id="tab-summary" class="tab-panel active">
  <div class="summary-grid">
    <div class="summary-card"><div class="num num-block"  id="count-block">0</div><div class="lbl">Blocked Today</div></div>
    <div class="summary-card"><div class="num num-redact" id="count-redact">0</div><div class="lbl">Redacted Today</div></div>
    <div class="summary-card"><div class="num num-warn"   id="count-warn">0</div><div class="lbl">Warned Today</div></div>
    <div class="summary-card"><div class="num num-allow"  id="count-allow">0</div><div class="lbl">Allowed Today</div></div>
  </div>
  <div style="font-size:12px;color:#57606a;text-align:center;margin-top:4px">
    Monitoring: ChatGPT · Claude · Gemini · Copilot · Perplexity
  </div>
</div>

<!-- Tab: Log -->
<div id="tab-log" class="tab-panel">
  <div id="log-container"></div>
  <button class="clear-btn" id="clear-log-btn">🗑 Clear Log</button>
</div>

<!-- Tab: Rules -->
<div id="tab-rules" class="tab-panel">
  <div id="custom-rules-list"></div>
  <div class="add-rule-form">
    <label for="r-name">Rule Name</label>
    <input type="text" id="r-name" placeholder="e.g. Project Phoenix"/>
    <label for="r-pattern">Regex Pattern</label>
    <input type="text" id="r-pattern" placeholder="e.g. \bPhoenix\b"/>
    <label for="r-level">Sensitivity Level</label>
    <select id="r-level">
      <option value="1">INTERNAL</option>
      <option value="2" selected>CONFIDENTIAL</option>
      <option value="3">RESTRICTED</option>
    </select>
    <button class="btn-add" id="add-rule-btn">+ Add Custom Rule</button>
    <div class="msg" id="rule-msg"></div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
